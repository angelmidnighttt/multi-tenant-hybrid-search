name: hybrid-search

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: hybrid-search-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hybrid_search}
      # Only used by db/init/002_roles.sql to set app_user's password.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    command:
      - postgres
      - -c
      - maintenance_work_mem=512MB        # build HNSW indexes in memory (much faster)
      - -c
      - max_parallel_maintenance_workers=2
    shm_size: 1gb                         # parallel HNSW builds need more than Docker's default 64MB /dev/shm
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only runs when the volume is empty (first initialization).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
